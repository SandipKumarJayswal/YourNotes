<script type="text/javascript">

		

let storageRef = firebase.storage().ref();
let selectedFolder, selectedFile;
let fileName = getInputs('#fileName');
if(window.location.pathname === '/FireUpload/pages/upload.html') {
  let file = getInputs('#file');
  let submit = getInputs('#done');
  let successNotification = getInputs('#success');
  let folders = getInputs('#select-folder');

  //Listen for chosen category.
  folders.addEventListener('change', (folder) => {
    selectedFolder = folder.target.value;
  });

  //Listen for upload from machine.
  file.addEventListener('change', (event) => {
    selectedFile = event.target.files[0];
    console.log(selectedFile);
    console.log();
  });

  //Listen for button 'Done' click.
  done.addEventListener('click', () => {
    //Check if the file is selected or not.
    if(file){
        let uploadTask = storageRef.child(`${selectedFolder}/` + fileName.value).put(selectedFile);
        uploadTask.on(firebase.storage.TaskEvent.STATE_CHANGED, // or 'state_changed'
        
          (snapshot) => {
            let progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
            success.classList.add('alert', 'alert-success');
            success.innerHTML = `Upload is <strong>${Math.trunc(progress)}%</strong> done`;
        
            switch (snapshot.state) {
              case firebase.storage.TaskState.PAUSED: // or 'paused'
                console.log('Upload is paused');
                break;
              case firebase.storage.TaskState.RUNNING: // or 'running'
                console.log('Upload is running');
                break;
            }
          }, (error) => {
        
          switch (error.code) {
            case 'storage/unauthorized':
              break;
        
            case 'storage/canceled':
              break;
        
            case 'storage/unknown':
              break;
          }
        }, () => {
          let downloadURL = uploadTask.snapshot.downloadURL;
          //If downloadURL is generated by Firebase, show a success alert.
          if(downloadURL) {
            success.innerHTML = `<strong>Uploaded Successfully :)</strong>`;
            saveMetaData(downloadURL, fileName.value, selectedFile.type, selectedFile.lastModifiedDate, selectedFile.size, selectedFolder, selectedFile.name.split('.').pop());
            setTimeout(() => {
                document.querySelector('.jumbotron').removeChild(success);
            }, 3000);
          }
          console.log(downloadURL);
        });
      //Show error  
    } else {
        success.classList.add('alert', 'alert-danger');
        success.innerHTML = `<strong>Something went wrong !</strong>`;
        setTimeout(() => {
            document.querySelector('.jumbotron').removeChild(success);
        }, 1000);
    } 
  });

  //Save meta data to firebase realtime database.
  let filesRef = firebase.database().ref('files/');

  function saveMetaData(url, nameOfFile, fileType, lastModifiedDate, fileSize, folderName, extension) {
    let currentFileRef = filesRef.push();
    currentFileRef.set({
      name: nameOfFile,
      url: url,
      type: fileType,
      date: lastModifiedDate,
      size: fileSize,
      folder: folderName,
      extension: extension
    });
  }
}

if(window.location.pathname === '/FireUpload/pages/files.html') {
  let downloadRef = firebase.database().ref('files');

  downloadRef.on('child_added', (child) => {
    console.log(child.val());

    let wrapCard = document.createElement('div');
    wrapCard.innerHTML = `
      <div class="card w-100 mt-4">
        <div class="card-header">${child.val().folder}</div>
        <div class="card-body">
          <h5><strong>${child.val().name}</strong></h5>
          <p><strong>${(child.val().size/1048576).toFixed(3)}</strong> MB</p>
          <p class="small"><strong>${child.val().extension.toUpperCase()}</strong></p>
          <a href="${child.val().url}" target="_blank" class="btn btn-dark">Download</a>
        </div>
      </div>
    `;

      document.querySelector('.files').appendChild(wrapCard);
  });
}

function getInputs(name) {
  return document.querySelector(name);
}
	</script>
